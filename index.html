<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>QuickBite | Premium Multi-Role Food Delivery Platform</title>

    <!-- Anti-Flash of White / Instant Theme Initialization -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('quickbite_theme');
          var theme = null;
          if (saved) {
            try { theme = JSON.parse(saved); } catch(e) { theme = saved; }
          }
          if (!theme) {
            theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
          if (theme === 'dark') {
            document.documentElement.style.backgroundColor = '#090D16';
          } else {
            document.documentElement.style.backgroundColor = '#F8FAFC';
          }
        } catch(e) {}
      })();
    </script>
    <style>
      :root { color-scheme: light dark; }
      html { background-color: #F8FAFC; color: #0F172A; }
      html[data-theme="dark"] { background-color: #090D16 !important; color: #F8FAFC !important; color-scheme: dark; }
      html[data-theme="light"] { background-color: #F8FAFC !important; color: #0F172A !important; color-scheme: light; }
      body { background-color: inherit; }
      #root { min-height: 100vh; background-color: inherit; }
      @keyframes qbPulse { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.08); opacity: 0.7; } }
      @keyframes qbSpin { to { transform: rotate(360deg); } }
      .qb-initial-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background-color: inherit;
        color: inherit;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍔</text></svg>" />

    <!-- Google Fonts: Poppins & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Leaflet Interactive Maps CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  </head>
  <body>
    <div id="root">
      <div class="qb-initial-loader">
        <div style="font-size: 2.2rem; animation: qbPulse 1.2s ease-in-out infinite;">🍔</div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="width: 14px; height: 14px; border: 2px solid #FF5A26; border-top-color: transparent; border-radius: 50%; animation: qbSpin 0.7s linear infinite;"></div>
          <span style="font-size: 0.85rem; font-weight: 600; letter-spacing: 0.5px; opacity: 0.75;">QuickBite Loading...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
